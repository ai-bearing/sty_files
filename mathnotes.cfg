% mathnotes.cfg  --  tex4ht configuration for my_style / notes / homework / exposition
% Build with:  make4ht -uc mathnotes.cfg main.tex
%
% Math is emitted as MathML (tex4ht expands your custom macros down to
% primitives it understands, which is the most forgiving choice for a macro
% set like yours). To switch to MathJax instead, replace "mathml" below with
% "mathjax" -- but note you would then need to teach MathJax about \mathds,
% \mleft/\mright and braket's \Set, since MathJax re-parses the original LaTeX.

\RequirePackage{etoolbox}

\Preamble{xhtml,html5,mathml}

% Wrap an amsthm environment in <div class="thmbox CLASS"> ... </div>.
% The \ifvmode\IgnorePar\fi\EndP idiom closes any open paragraph first so the
% div is placed as a block element (the same idiom tex4ht's own docs use).
\newcommand{\HtmlThmBox}[2]{%
  \BeforeBeginEnvironment{#1}{\ifvmode\IgnorePar\fi\EndP\HCode{<div class="thmbox #2">}}%
  \AfterEndEnvironment{#1}{\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}%
}

% Defer the wrapping until \begin{document}, when every \newtheorem from
% my_style.sty (and amsthm's proof) is guaranteed to be defined.
\AtBeginDocument{%
  % green: definitions and solutions
  \HtmlThmBox{definition}{def}%
  \HtmlThmBox{solution}{def}%
  % navy: theorem-like results
  \HtmlThmBox{theorem}{thm}%
  \HtmlThmBox{proposition}{thm}%
  \HtmlThmBox{lemma}{thm}%
  \HtmlThmBox{corollary}{thm}%
  % light blue: remarks
  \HtmlThmBox{remark}{rem}%
  % gray: supporting environments
  \HtmlThmBox{proof}{neutral}%
  \HtmlThmBox{note}{neutral}%
  \HtmlThmBox{aside}{neutral}%
  \HtmlThmBox{example}{neutral}%
  % red: problems and exercises
  \HtmlThmBox{problem}{prob}%
  \HtmlThmBox{exercise}{prob}%
  % optional: environments declared in my_style.sty with no box in the PDF
  \HtmlThmBox{claim}{neutral}%
  \HtmlThmBox{method}{neutral}%
}

% --- styling (these rules are appended to the generated <jobname>.css) ---
\Css{.thmbox{border-left:3px solid \#999;padding-left:0.9em;margin:0.8em 0;}}
\Css{.thmbox.def{border-left-color:\#1a7f37;}}      % green!75!black
\Css{.thmbox.thm{border-left-color:\#1a3e8c;}}      % blue!50!black
\Css{.thmbox.rem{border-left-color:\#6a7fd0;}}      % blue!50!white
\Css{.thmbox.neutral{border-left-color:\#808080;}}  % gray
\Css{.thmbox.prob{border-left-color:\#cc0000;}}     % red

% Your \theoremstyle{main} was a bold name + colon, upright body.
% amsthm's HTML output puts the theorem name in its own element; the exact
% class varies, so inspect the generated HTML once and tighten this selector
% if needed. This bolds the common cases.
\Css{.theoremheaderplain, .thmbox b, .thmbox dt{font-weight:bold;}}

\begin{document}
\EndPreamble
